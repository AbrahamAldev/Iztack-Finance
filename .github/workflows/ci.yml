name: CI - Tests y Lint

on:
  push:
    branches: [develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [develop, main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sistema_financiero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Instalar Playwright browsers
        run: |
          cd backend
          playwright install chromium
          playwright install-deps chromium

      - name: Correr tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/sistema_financiero_test
          DATABASE_SYNC_URL: postgresql+psycopg://test:test@localhost:5432/sistema_financiero_test
          SECRET_KEY: test-key-for-ci
          ENVIRONMENT: testing
        run: |
          cd backend
          python -m pytest tests/ -v

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar linters
        run: |
          pip install ruff
      - name: Ruff check
        run: |
          cd backend
          ruff check app/
      - name: Ruff format check
        run: |
          cd backend
          ruff format --check app/

  build-docker:
    name: Build Docker Images (Validation)
    runs-on: ubuntu-latest
    needs: [test-backend, lint-backend]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Backend dev (validation only)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: sistema-financiero/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Backend prod (validation only)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          tags: sistema-financiero/backend:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Frontend prod (validation only)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          tags: sistema-financiero/frontend:prod
          build-args: NEXT_PUBLIC_API_URL=https://api.iztack.com/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Verify docker-compose
        run: |
          docker-compose config -q
          echo "✅ docker-compose válido"
