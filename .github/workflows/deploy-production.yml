name: 🚀 Deploy a Producción (Proxmox)

on:
  push:
    branches: [main]
  workflow_dispatch:  # Permite deploy manual desde GitHub UI

jobs:
  deploy:
    name: Deploy to Proxmox CT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy via SSH to Proxmox CT
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROXMOX_CT_HOST }}
          username: ${{ secrets.PROXMOX_CT_USER }}
          key: ${{ secrets.PROXMOX_CT_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=== Pulling latest code ==="
            cd /opt/iztack-finance
            git fetch origin
            git reset --hard origin/main
            echo "=== Restarting stack ==="
            docker compose -f docker-compose.prod.yml up -d --build
            echo "=== Health check ==="
            sleep 10
            curl -sf http://localhost:8000/api/health || echo "WARNING: Health check failed, check logs"
            echo "=== Done! ==="

      - name: Notificar resultado
        if: always()
        run: |
          echo "🚀 Deploy a producción completado: ${{ job.status }}"