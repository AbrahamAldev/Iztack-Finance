# Sistema Finanzas MX - Docker Compose (Producción)
version: '3.8'

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  storage_data:
  sensitive_data:

services:
  # === Reverse Proxy ===
  caddy:
    image: caddy:2-alpine
    container_name: sf-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - internal
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  # === Database ===
  postgres:
    image: postgres:16-alpine
    container_name: sf-postgres
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: sistema_finanzas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Cache & Queue ===
  redis:
    image: redis:7-alpine
    container_name: sf-redis
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === API (FastAPI) ===
  api:
    build:
      context: ../../apps/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
    container_name: sf-api
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sistema_finanzas
      REDIS_URL: redis://redis:6379/0
    volumes:
      - storage_data:/data/storage
      - sensitive_data:/data/sensitive
    expose:
      - "8000"

  # === Worker (ARQ) ===
  worker:
    build:
      context: ../../apps/worker
      dockerfile: ../../infrastructure/docker/Dockerfile.worker
    container_name: sf-worker
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sistema_finanzas
      REDIS_URL: redis://redis:6379/0
    volumes:
      - storage_data:/data/storage
      - sensitive_data:/data/sensitive

  # === Bot de Telegram ===
  bot:
    build:
      context: ../../apps/bot
      dockerfile: ../../infrastructure/docker/Dockerfile.bot
    container_name: sf-bot
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - api
      - redis:
          condition: service_healthy
    env_file:
      - ../../.env
    environment:
      API_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0

  # === Frontend (Next.js) ===
  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infrastructure/docker/Dockerfile.web
    container_name: sf-web
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: https://tudominio.com/api
    expose:
      - "3000"

  # === Adminer (DB client - opcional) ===
  adminer:
    image: adminer:4
    container_name: sf-adminer
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  caddy_data:
  caddy_config: