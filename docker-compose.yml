name: iztack-finance

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sistema_financiero
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Redis (Task Queue / Cache)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: sf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Backend API (FastAPI)
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sf-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sistema_financiero
      DATABASE_SYNC_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/sistema_financiero
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      SECRET_KEY: ${SECRET_KEY:-default-secret-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_playwright_browsers:/root/.cache/ms-playwright
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level info

  # =============================================================================
  # Frontend (Next.js Dashboard)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    volumes:
      - frontend_node_modules:/app/node_modules
    command: npm run dev

  # =============================================================================
  # Telegram Bot (standalone polling process)
  # =============================================================================
  telegram-bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sf-telegram-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sistema_financiero
      DATABASE_SYNC_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/sistema_financiero
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID_AUTHORIZED: ${TELEGRAM_CHAT_ID_AUTHORIZED:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      SECRET_KEY: ${SECRET_KEY:-default-secret-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./backend:/app
    command: python bot_main.py
    # El bot sólo necesita salida HTTPS a api.telegram.org (no expone puertos)

  # =============================================================================
  # Admin Portal (admfinance.iztack.com)
  # =============================================================================
  admin:
    image: nginx:alpine
    container_name: sf-admin
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./frontend/admin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/admin/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_playwright_browsers:
  frontend_node_modules:
